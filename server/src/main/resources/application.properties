spring.application.name=vetcare
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vetcare}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT --- (sem valor padrão: a aplicação NÃO sobe sem JWT_SECRET de 32+ caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- Admin inicial (criado no 1º start se não existir nenhum admin) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}

# --- Dados de demonstração (somente desenvolvimento) ---
app.seed.enabled=${SEED_ENABLED:false}
app.seed.senha=${SEED_SENHA:}

# --- CORS (origens separadas por vírgula) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# --- Regras de negócio ---
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.consulta.duracao-minutos=30
app.consulta.antecedencia-cancelamento-horas=2
